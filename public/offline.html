<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>오프라인 · 요리담</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #ffffff; color: #20251d;
        font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif; text-align: center; }
      main { padding: 24px; max-width: 320px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #50574c; margin: 0 0 24px; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 24px; background: #7ff518; color: #19210f; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/yoridam-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
